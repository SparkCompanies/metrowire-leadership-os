<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metro Wire &amp; Cable — Leadership OS (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700&family=Questrial&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F3280; --navy-2:#283F98; --navy-3:#3149A6; --copper:#C4702A; --copper-2:#E09455; --copper-3:#F1C9A6;
  --bg:#F3F2EE; --surface:#FFFFFF; --surface-2:#F8F7F4; --ink:#0F1A2B; --body:#2B3340; --muted:#6B7280;
  --line:#E3E1DB; --line-2:#EEECE7; --acc:var(--copper); --acc-2:var(--copper-2); --acc-soft:#FAEDE1; --acc-ink:#7C4416;
  --good:#1F7A4D; --good-soft:#E1F1E8; --bad:#B23A3A; --bad-soft:#F9E5E5; --warn:#B7791F; --warn-soft:#FBF0DC;
  --side:var(--navy); --side-ink:#FFFFFF; --side-muted:#AEB8DD; --side-line:#34479E;
  --shadow:0 1px 0 rgba(15,26,43,.04), 0 10px 30px -18px rgba(15,26,43,.25);
  --r:14px; --r-sm:8px;
  --display:"Century Gothic","Kumbh Sans","Questrial","Poppins",system-ui,sans-serif; --text:"Century Gothic","Kumbh Sans","Questrial","Poppins",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1420; --surface:#161D2B; --surface-2:#1B2333; --ink:#F3F4F6; --body:#D5D9E0; --muted:#8E97A6;
    --line:#26303F; --line-2:#202836; --acc-soft:#2E2119; --acc-ink:#EBA26A;
    --good:#5FBF86; --good-soft:#17291F; --bad:#E27272; --bad-soft:#331C1C; --warn:#D9A35A; --warn-soft:#2D2415;
    --side:#172566; --side-line:#2A3B8A; --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161D2B; --surface-2:#1B2333; --ink:#F3F4F6; --body:#D5D9E0; --muted:#8E97A6;
  --line:#26303F; --line-2:#202836; --acc-soft:#2E2119; --acc-ink:#EBA26A;
  --good:#5FBF86; --good-soft:#17291F; --bad:#E27272; --bad-soft:#331C1C; --warn:#D9A35A; --warn-soft:#2D2415;
  --side:#172566; --side-line:#2A3B8A; --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; height:100%; background:var(--bg); color:var(--body); font-family:var(--text); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; color:var(--ink)}
h1{font-family:var(--display); font-weight:700; font-size:34px; line-height:1.05; letter-spacing:-.01em}
h2{font-family:var(--display); font-weight:700; font-size:19px; line-height:1.2}
h3{font-size:14px; font-weight:600}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0}
input,select,textarea{font:inherit; color:var(--body)}
svg.i{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100%}
.side{background:var(--side); color:var(--side-ink); display:flex; flex-direction:column; padding:22px 16px 16px; position:sticky; top:0; height:100vh; height:100dvh; overflow:hidden}
.brand{display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:4px 6px 16px; border-bottom:1px solid var(--side-line)}
.brand img{width:176px; height:auto; display:block}
.brand-mark{width:36px; height:36px; border-radius:9px; background:var(--copper); display:grid; place-items:center; flex:none}
.brand-mark svg{width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.brand b{font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.05em; display:block; line-height:1.05; text-transform:uppercase}
.brand small{display:block; color:var(--side-muted); font-size:11.5px; margin-top:4px}
.nav{display:flex; flex-direction:column; gap:1px; margin-top:10px; flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin; padding-right:2px}
.nav a{display:flex; align-items:center; gap:11px; color:#CBD3E0; text-decoration:none; padding:7px 10px; border-radius:8px; font-size:14px; flex:none}
.nav a svg{opacity:.7}
.nav a:hover{background:rgba(255,255,255,.08); color:#fff}
.nav a.on{background:rgba(255,255,255,.13); color:#fff; box-shadow:inset 3px 0 0 var(--copper)}
.nav a.on svg{opacity:1; color:var(--copper-2)}
.nav .grp{color:var(--side-muted); font-size:11.5px; padding:12px 10px 3px; flex:none}
.side-foot{margin-top:auto; padding-top:12px; border-top:1px solid var(--side-line); color:var(--side-muted); font-size:11.5px; flex:none}
.side-foot .team{display:flex; align-items:center; gap:8px; margin-bottom:10px; color:#CBD3E0; font-size:12.5px}
.avs{display:flex}
.av{width:26px; height:26px; border-radius:50%; background:#3B53B3; color:#fff; font-size:10px; font-weight:600; display:grid; place-items:center; border:2px solid var(--side); margin-left:-7px}
.av:first-child{margin-left:0}
.spark{display:flex; align-items:baseline; gap:6px; color:#fff; margin-top:3px}
.spark b{font-family:"Playfair Display",Georgia,serif; font-size:14px; letter-spacing:.12em}
.spark span{font-size:9px; letter-spacing:.2em; color:#DEBA6F; font-weight:600}
.spark sup{font-size:8px; color:#DEBA6F}
.side-foot p{margin-top:6px; font-size:11px}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 32px 12px}
.crumb{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13.5px}
.crumb b{color:var(--ink); font-weight:500}
.crumb .sep{width:3px; height:3px; border-radius:50%; background:var(--muted); opacity:.5}
.pill{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; padding:5px 11px; border-radius:999px; background:var(--surface); color:var(--body); box-shadow:var(--shadow); white-space:nowrap}
.pill.live{color:var(--acc-ink); background:var(--acc-soft); box-shadow:none}
.pill.live::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--bad); animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.page{padding:18px 32px 48px; max-width:1280px; width:100%}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin:8px 0 22px}
.page-head .lede{color:var(--muted); margin-top:8px; max-width:64ch; font-size:15.5px}

/* ---------- controls ---------- */
.btn{display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:14.5px; font-weight:500; line-height:1}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--navy); color:#fff; border-color:var(--navy)}
.btn.primary:hover{background:var(--navy-3); border-color:var(--navy-3)}
.btn.acc{background:var(--acc); color:#fff; border-color:var(--acc)}
.btn.acc:hover{background:var(--acc-2); border-color:var(--acc-2)}
.btn.lg{padding:14px 22px; font-size:16px; border-radius:12px}
.btn.sm{padding:6px 11px; font-size:13px; border-radius:8px}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{color:var(--ink); border-color:var(--line)}
.btn:disabled{opacity:.4; cursor:default}
.input,select.input,textarea.input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:14.5px}
textarea.input{min-height:84px; resize:vertical}
.field{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted)}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:12px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:50; box-shadow:var(--shadow)}
.toast.show{opacity:1; transform:translateX(-50%)}
.kbd{font-size:12px; color:var(--muted)}

/* ---------- surfaces ---------- */
.card{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow)}
.card-h{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 22px 0}
.card-h h2{font-size:17px}
.card-b{padding:16px 22px 20px}
.grid{display:grid; gap:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figures{display:flex; gap:0; margin:0 0 22px}
.fig{padding:6px 28px 6px 0; margin-right:28px; border-right:1px solid var(--line)}
.fig:last-child{border-right:0}
.fig .v{font-family:var(--display); font-weight:700; font-size:38px; line-height:.95; color:var(--ink); letter-spacing:-.02em}
.fig .v small{font-size:22px; color:var(--muted); font-weight:600; margin-left:2px}
.fig .l{font-size:13px; color:var(--muted); margin-top:6px}
.fig .d{font-size:13px; margin-top:3px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.tag{display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; letter-spacing:.01em}
.tag.good{background:var(--good-soft); color:var(--good)} .tag.bad{background:var(--bad-soft); color:var(--bad)}
.tag.acc{background:var(--acc-soft); color:var(--acc-ink)} .tag.gray{background:var(--line-2); color:var(--muted)}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%; flex:none}
.dot.good{background:var(--good)} .dot.bad{background:var(--bad)} .dot.off{background:var(--line)}
table.t{width:100%; border-collapse:collapse; font-size:14px}
.t th{text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:6px 10px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
.t td{padding:11px 10px; border-bottom:1px solid var(--line-2); vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.num,.t th.num{text-align:right; font-variant-numeric:tabular-nums}
.t td.own,.t td.nm,.t td.act,.t td.goal{white-space:nowrap}
.t td.nm{font-weight:500; color:var(--ink)}
.cellv{display:inline-block; min-width:46px; text-align:right; padding:3px 7px; border-radius:6px; font-variant-numeric:tabular-nums; font-weight:500}
.cellv.good{background:var(--good-soft); color:var(--good)} .cellv.bad{background:var(--bad-soft); color:var(--bad)}
.heat{display:inline-flex; gap:3px; vertical-align:middle}
.heat i{width:12px; height:18px; border-radius:3px; background:var(--line-2); display:block}
.heat i.good{background:var(--good)} .heat i.bad{background:var(--bad)}
.heat i.now{outline:2px solid var(--ink); outline-offset:1px}
.owner{display:inline-flex; align-items:center; gap:7px; white-space:nowrap}
.owner .av{margin:0; border:0; width:24px; height:24px; font-size:9px; background:var(--acc-soft); color:var(--acc-ink)}
.scroll-x{overflow-x:auto}
.empty{padding:28px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:var(--r-sm)}
.check{width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none}
.check.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.check svg{width:14px; height:14px; stroke-width:2.5}
.list{display:flex; flex-direction:column}
.item{display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.item .txt{flex:1; min-width:0; color:var(--ink)}
.item .txt.done{color:var(--muted); text-decoration:line-through}
.item .meta{font-size:12.5px; color:var(--muted); margin-top:2px}
.rank{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; border:1.5px solid var(--line); background:var(--surface); color:var(--muted); flex:none}
.rank.on{background:var(--acc); border-color:var(--acc); color:#fff}
.bar{height:4px; background:var(--line-2); border-radius:2px; overflow:hidden}
.bar > i{display:block; height:100%; background:var(--acc); width:0; transition:width .3s linear}
.bar.over > i{background:var(--bad)}

/* ---------- home ---------- */
.home-h{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin:10px 0 26px}
.home-h .date{color:var(--muted); font-size:15px; margin-bottom:8px}
.home-h h1{font-size:42px}
.home-h .lede{color:var(--muted); font-size:16px; margin-top:10px; max-width:54ch}
.brief{font-size:16px; line-height:1.65; color:var(--body)}
.brief p + p{margin-top:12px}
.brief b{color:var(--ink); font-weight:600}
.brief .num{font-variant-numeric:tabular-nums}
.agenda-list .item{padding:10px 0}
.agenda-list .n{width:26px; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
.agenda-list .m{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
.roster{display:flex; flex-wrap:wrap; gap:8px}
.roster .p{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--body)}
.roster .av{margin:0; border:0; width:26px; height:26px; font-size:10px; background:var(--navy); color:#fff}

/* ---------- presenting (meeting mode) ---------- */
.app.presenting{grid-template-columns:minmax(0,1fr)}
.app.presenting .side,.app.presenting .topbar{display:none}
.app.presenting .page{max-width:none; padding:0}
.stage{min-height:100vh; min-height:100dvh; background:radial-gradient(1200px 700px at 80% -10%, #2E47A8 0%, var(--navy) 55%, #121E55 100%); color:#E6EBF2; display:flex; flex-direction:column;
  --bg:transparent; --surface:rgba(255,255,255,.055); --surface-2:rgba(255,255,255,.04); --ink:#F5F7FA; --body:#D7DEE8; --muted:#93A1B8; --line:rgba(255,255,255,.14); --line-2:rgba(255,255,255,.09);
  --acc-soft:rgba(196,112,42,.22); --acc-ink:#F1C9A6; --good:#6FD39A; --good-soft:rgba(111,211,154,.16); --bad:#F08A8A; --bad-soft:rgba(240,138,138,.16); --warn:#F0B86A; --shadow:none}
.stage .card{background:var(--surface); box-shadow:none; border:1px solid var(--line-2); backdrop-filter:blur(6px)}
.stage .btn{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.16); color:#fff}
.stage .btn:hover{border-color:var(--copper-2)}
.stage .btn.primary{background:var(--copper); border-color:var(--copper)}
.stage .btn.primary:hover{background:var(--copper-2); border-color:var(--copper-2)}
.stage .btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.stage .btn.ghost:hover{color:#fff; border-color:rgba(255,255,255,.2)}
.stage .input,.stage select.input,.stage textarea.input{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.16); color:#fff}
.stage select.input option{color:#111}
.stage .check{background:transparent; border-color:rgba(255,255,255,.3)}
.stage .check.on{background:var(--copper); border-color:var(--copper); color:#fff}
.stage .rank{background:transparent; border-color:rgba(255,255,255,.3)}
.stage .rank.on{background:var(--copper); border-color:var(--copper); color:#fff}
#app.presenting + .toast{background:#fff; color:var(--navy)}
.stage .cellv{font-weight:600}
.stage .owner .av{background:rgba(255,255,255,.12); color:#fff}
.stage .empty{border-color:rgba(255,255,255,.2)}
.stage .toast{background:#fff; color:var(--navy)}
.s-top{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 36px 0}
.s-top .who{display:flex; align-items:center; gap:12px; font-size:14px; color:var(--muted)}
.s-top .who b{color:#fff; font-weight:600}
.s-top .who .mark{display:block; height:44px; width:auto; margin-right:8px}
.s-top .tot{font-family:var(--display); font-weight:700; font-size:16px; color:#fff; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:8px}
.s-top .tot span{font-size:13px; color:var(--muted); font-family:var(--text); font-weight:400}
.rail{display:flex; gap:6px; padding:16px 36px 0}
.rail button{flex:1; text-align:left; padding:0; display:flex; flex-direction:column; gap:8px; color:var(--muted); min-width:0}
.rail .trk{height:4px; width:100%; background:rgba(255,255,255,.14); border-radius:2px; overflow:hidden}
.rail .trk i{display:block; height:100%; width:0; background:var(--copper-2)}
.rail .done .trk i{width:100%; background:rgba(255,255,255,.55)}
.rail .lbl{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%}
.rail .on .lbl{color:#fff; font-weight:600}
.rail .done .lbl{color:rgba(255,255,255,.6)}
.s-body{display:grid; grid-template-columns:300px minmax(0,1fr); gap:36px; padding:34px 36px 40px; flex:1; align-items:start}
.s-left{position:sticky; top:24px; display:flex; flex-direction:column; align-items:flex-start; gap:18px}
.ring{position:relative; width:220px; height:220px}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:8}
.ring .trk{stroke:rgba(255,255,255,.12)}
.ring .prog{stroke:var(--copper-2); stroke-linecap:round; transition:stroke-dashoffset .25s linear}
.ring.over .prog{stroke:var(--bad)}
.ring .txt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring .big{font-family:var(--display); font-weight:700; font-size:44px; line-height:1; color:#fff; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.ring .of{font-size:13px; color:var(--muted); margin-top:6px}
.s-left .segno{font-size:13px; color:var(--copper-2); font-weight:600; letter-spacing:.02em}
.s-left h1{font-size:40px; color:#fff; line-height:1.02; letter-spacing:-.01em}
.s-left .blurb{color:var(--muted); font-size:15.5px; max-width:30ch; line-height:1.55}
.s-left .ctl{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.s-right{min-width:0}
.s-right h2{color:#fff}
.s-right .card-h h2{font-size:18px}
.stage .kbd{color:var(--muted)}
.people{display:flex; flex-wrap:wrap; gap:10px}
.person{display:flex; align-items:center; gap:12px; padding:12px 18px 12px 12px; border:1px solid var(--line); border-radius:999px; background:var(--surface); text-align:left; color:#fff}
.person.on{border-color:var(--copper-2); background:var(--acc-soft)}
.person .av{margin:0; border:0; width:34px; height:34px; font-size:12px; background:rgba(255,255,255,.14); color:#fff}
.person small{display:block; color:var(--muted); font-size:12px}
.rate{display:flex; gap:8px; flex-wrap:wrap}
.rate button{width:46px; height:46px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-family:var(--display); font-weight:700; font-size:16px; color:#fff}
.rate button.on{background:var(--copper); border-color:var(--copper)}
.recap{white-space:pre-wrap; font-size:15px; line-height:1.65; background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px; padding:18px 20px; color:var(--body)}
.solve{background:var(--acc-soft); border-radius:10px; padding:12px 14px; margin:6px 0 4px 40px; display:grid; grid-template-columns:1fr 170px auto; gap:8px; align-items:center}
.hl{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.stage .figures{margin-bottom:18px}
.stage .fig{border-color:var(--line)}
.stage .fig .v{color:#fff}
.stage h2{color:#fff}
.stage .item .txt{color:#fff}
.stage .item .txt.done{color:var(--muted)}
.stage .t td.nm{color:#fff}
.stage .t th{border-color:var(--line)}
.stage .t td{border-color:var(--line-2)}
.stage .heat i{background:rgba(255,255,255,.1)}
.stage .heat i.good{background:var(--good)} .stage .heat i.bad{background:var(--bad)}
.stage .heat i.now{outline-color:#fff}
.stage .tag.gray{background:rgba(255,255,255,.1); color:var(--muted)}
.enter{animation:enter .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}


/* ---------- team switcher ---------- */
.tsw{position:relative; display:flex; align-items:center; margin:14px 0 2px; background:rgba(255,255,255,.08); border:1px solid var(--side-line); border-radius:10px; padding:0 12px 0 12px; cursor:pointer}
.tsw:hover{border-color:var(--copper)}
.tsw .tsw-l{position:absolute; top:6px; left:13px; font-size:10.5px; color:var(--side-muted); pointer-events:none}
.tsw select{appearance:none; -webkit-appearance:none; background:transparent; border:0; color:#fff; font:inherit; font-family:var(--display); font-weight:700; font-size:15px; padding:20px 26px 9px 0; width:100%; cursor:pointer; outline:none}
.tsw select option{color:#111}
.tsw .chev{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--side-muted); pointer-events:none}
.live-dot{width:7px; height:7px; border-radius:50%; background:var(--bad); margin-left:auto; animation:blink 1.4s infinite}
.trend{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.mini{width:100%; height:32px; display:block; margin-top:6px}
.mini rect{fill:var(--line)} .mini rect.good{fill:var(--good)} .mini line{stroke:var(--acc); stroke-dasharray:2 3}
.rdots{display:inline-flex; gap:4px; margin-top:8px}
.rdots i{width:12px; height:12px; border-radius:50%; display:block; background:var(--line)}
.rdots i.good{background:var(--good)} .rdots i.warn{background:var(--warn)} .rdots i.bad{background:var(--bad)}
/* ---------- company overview ---------- */
.days{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
.day{border-top:2px solid var(--line); padding-top:10px; min-height:96px}
.day.today{border-top-color:var(--acc)}
.day .dn{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--muted); margin-bottom:8px}
.day.today .dn{color:var(--ink); font-weight:600}
.slot{display:block; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px; padding:10px 12px; color:var(--ink)}
.slot:hover{border-color:var(--acc)}
.slot b{display:block; font-family:var(--display); font-weight:700; font-size:14.5px}
.slot span{font-size:12.5px; color:var(--muted)}
.slot.live{border-color:var(--acc); background:var(--acc-soft)}
.slot.empty-slot{border-style:dashed; color:var(--muted); font-size:12.5px; background:transparent}
.tcard h2{font-size:20px}
.tfigs{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line-2)}
.tfigs b{display:block; font-family:var(--display); font-weight:700; font-size:24px; line-height:1; color:var(--ink)}
.tfigs b small{font-size:14px; color:var(--muted); font-weight:600}
.tfigs span{display:block; font-size:12px; color:var(--muted); margin-top:4px}
.tcard .avs .av{background:var(--navy); border-color:var(--surface)}
/* ---------- roles chart, second level ---------- */
.subs{display:flex; flex-direction:column; gap:8px; margin-top:8px; padding-left:18px; border-left:1px solid var(--line)}
.seat.sm{width:214px; padding:10px 12px}
.seat.sm .role{font-size:14px}
.seat.sm .who{font-size:12.5px; margin-top:4px}


/* ---------- coach tools ---------- */
.coach-h{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:18px; margin-bottom:18px}
.coach-id{display:flex; align-items:center; gap:14px}
.coach-id .av{width:52px; height:52px; font-size:17px; margin:0; border:0; background:var(--navy); color:#fff}
.coach-id b{display:block; font-family:var(--display); font-weight:700; font-size:20px; color:var(--ink); line-height:1.1}
.coach-id span{color:var(--muted); font-size:13.5px}
.next{display:flex; gap:16px; align-items:flex-start}
.next .cal{width:58px; flex:none; text-align:center; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.next .cal b{display:block; background:var(--acc); color:#fff; font-size:11px; padding:3px 0; letter-spacing:.04em}
.next .cal span{display:block; font-family:var(--display); font-weight:700; font-size:24px; color:var(--ink); padding:4px 0 6px}
.next .txt b{color:var(--ink); font-weight:600; display:block}
.next .txt{font-size:14px; color:var(--body); line-height:1.5}
.create{display:flex; gap:8px; flex-wrap:wrap}
.folders{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.folders button{display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:13.5px; color:var(--body)}
.folders button.on{background:var(--navy); border-color:var(--navy); color:#fff}
.folders button small{color:inherit; opacity:.6}
.doc{display:grid; grid-template-columns:34px minmax(0,1fr) 120px 100px 60px; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line-2); font-size:14px}
.doc:last-child{border-bottom:0}
.doc .ico{width:34px; height:34px; border-radius:8px; display:grid; place-items:center; background:var(--acc-soft); color:var(--acc-ink)}
.doc .ico.pdf{background:var(--bad-soft); color:var(--bad)} .doc .ico.sheet{background:var(--good-soft); color:var(--good)} .doc .ico.board{background:#E8ECF9; color:var(--navy)}
.doc .nm{color:var(--ink); font-weight:500; min-width:0; line-height:1.3}
.doc .nm small{display:block; color:var(--muted); font-weight:400; font-size:12px}
.doc .by{color:var(--muted); font-size:13px} .doc .dt{color:var(--muted); font-size:13px} .doc .sz{color:var(--muted); font-size:12.5px; text-align:right}
.tools{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.tool{background:var(--surface-2); border:1px solid var(--line-2); border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:8px}
.tool h3{font-family:var(--display); font-weight:700; font-size:15.5px; color:var(--ink)}
.tool p{font-size:13.5px; color:var(--muted); flex:1}
.tool .bar{margin-top:2px}
.notes .n{padding:12px 0; border-bottom:1px solid var(--line-2)}
.notes .n:last-child{border-bottom:0}
.notes .d{font-size:12px; color:var(--acc-ink); font-weight:600; margin-bottom:4px}
.notes p{font-size:14px; line-height:1.55; color:var(--body)}
.prepf{display:grid; gap:12px; margin-top:6px}
.board{position:relative; height:520px; background:#fff; border-radius:12px; border:1px solid var(--line); overflow:hidden; background-image:radial-gradient(var(--line) 1px, transparent 1px); background-size:22px 22px}
.board canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair}
.board .note{position:absolute; width:170px; min-height:110px; background:#FFF3B0; box-shadow:0 8px 20px -10px rgba(0,0,0,.35); padding:10px 12px 12px; font-size:13.5px; line-height:1.4; color:#3B3300; border-radius:3px; cursor:grab; transform:rotate(-1deg)}
.board .note:nth-child(even){transform:rotate(1.2deg); background:#CFE9FF; color:#0A2A4A}
.board .note .nt{outline:none; min-height:60px}
.board .note .grip{height:8px; margin:-4px -6px 8px; cursor:grab}
.board .note .del{position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; opacity:.5}
.board .note .del:hover{opacity:1}
.board .note .del svg{width:12px; height:12px}
.swatch{width:26px; height:26px; border-radius:50%; border:2px solid transparent; padding:0}
.swatch.on{border-color:var(--ink); box-shadow:inset 0 0 0 2px #fff}
@media (max-width:820px){ .coach-h{grid-template-columns:1fr} .doc{grid-template-columns:34px minmax(0,1fr) 90px} .doc .by,.doc .sz{display:none} .tools{grid-template-columns:1fr} .board{height:380px} }

.seat.editing{cursor:default; width:260px}
.seat.editing .input{font-size:13px; padding:7px 9px}
@media print{ .side,.topbar,.btn,.page-head button{display:none!important} .app{display:block} .page{padding:0; max-width:none} .card{box-shadow:none; border:1px solid #ddd} body{background:#fff} }

/* ---------- quarterly 1:1 ---------- */
.q-layout{display:grid; grid-template-columns:330px minmax(0,1fr); gap:18px; align-items:start}
.q-list .item{padding:10px 0; cursor:pointer; border-radius:8px}
.q-list .item:hover{background:var(--surface-2)}
.q-list .item.on{background:var(--acc-soft)}
.q-list .pairav{display:flex; align-items:center}
.q-list .pairav .av{border:2px solid var(--surface); margin:0; background:var(--navy); color:#fff}
.q-list .pairav .av + .av{margin-left:-8px; background:var(--acc)}
.q-list .lead-h{font-size:12px; color:var(--muted); padding:14px 0 4px; border-bottom:1px solid var(--line-2)}
.q-head{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.q-who{display:flex; align-items:center; gap:12px}
.q-who .av{width:44px; height:44px; font-size:14px; margin:0; border:0; background:var(--navy); color:#fff}
.q-who .av.r{background:var(--acc)}
.q-who b{display:block; font-family:var(--display); font-weight:700; font-size:17px; color:var(--ink)}
.q-who span{font-size:13px; color:var(--muted)}
.q-sec{padding:18px 0; border-top:1px solid var(--line-2)}
.q-sec h3{font-family:var(--display); font-weight:700; font-size:15px; color:var(--ink); display:flex; align-items:baseline; gap:10px}
.q-sec h3 small{font-weight:400; color:var(--muted); font-size:12.5px}
.q-sec .hint{font-size:13px; color:var(--muted); margin:4px 0 12px}
.q-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-2)}
.q-row:last-child{border-bottom:0}
.q-row .t{color:var(--ink); font-size:14.5px}
.q-row .t small{display:block; color:var(--muted); font-size:12px}
.seg3{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.seg3 button{padding:6px 12px; font-size:12.5px; color:var(--muted); border-right:1px solid var(--line); min-width:78px}
.seg3 button:last-child{border-right:0}
.seg3 button.on.g{background:var(--good-soft); color:var(--good); font-weight:600}
.seg3 button.on.w{background:var(--warn-soft); color:var(--warn); font-weight:600}
.seg3 button.on.b{background:var(--bad-soft); color:var(--bad); font-weight:600}
.q-notes{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.q-notes .field.wide{grid-column:1/-1}
.q-fit{display:flex; gap:10px; flex-wrap:wrap}
.q-fit button{display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:13.5px; color:var(--body)}
.q-fit button.on{border-color:var(--good); background:var(--good-soft); color:var(--good)}
.q-fit button .dot{width:9px; height:9px}
.q-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-top:18px; border-top:1px solid var(--line-2)}
.q-sum{background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px; padding:14px 16px; font-size:13.5px; line-height:1.55; color:var(--body)}
.q-sum b{color:var(--ink)}
@media (max-width:1000px){ .q-layout{grid-template-columns:1fr} }
@media (max-width:820px){ .q-notes{grid-template-columns:1fr} .q-row{grid-template-columns:1fr} }
@media print{ .q-list,.q-foot .btn{display:none!important} .q-layout{grid-template-columns:1fr} }


/* ---------- sign-in gate ---------- */
body.locked .app,body.locked .toast{display:none!important}
.gate{display:none; min-height:100vh; min-height:100dvh; background:radial-gradient(1200px 700px at 80% -10%, #2E47A8 0%, var(--navy) 55%, #121E55 100%); color:#E6EBF2; align-items:center; justify-content:center; padding:24px}
body.locked .gate{display:flex}
.gate-card{width:100%; max-width:420px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:18px; padding:32px 30px; backdrop-filter:blur(8px)}
.gate-card img{width:190px; height:auto; display:block; margin-bottom:22px}
.gate-card h1{color:#fff; font-size:24px; margin-bottom:6px}
.gate-card p{color:#AEB8DD; font-size:14px; margin-bottom:20px; line-height:1.5}
.gate-card .field{color:#AEB8DD; margin-bottom:14px}
.gate-card .input{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.18); color:#fff; font-size:16px}
.gate-card .input::placeholder{color:rgba(255,255,255,.45)}
.gate-card .input.pin{letter-spacing:.35em; font-size:22px; font-weight:700; text-align:center}
.gate-card .btn.primary{width:100%; justify-content:center; background:var(--copper); border-color:var(--copper); color:#fff; padding:13px; font-size:15px; margin-top:6px}
.gate-card .btn.primary:hover{background:var(--copper-2); border-color:var(--copper-2)}
.gate-card .err{color:#F0A0A0; font-size:13px; min-height:18px; margin-top:8px}
.gate-card .foot{margin-top:20px; font-size:11.5px; color:#8F9BC2; display:flex; justify-content:space-between; align-items:baseline}
.gate-card .foot b{font-family:"Playfair Display",Georgia,serif; letter-spacing:.1em; color:#fff; font-size:12px}
.gate-card .foot span{color:#DEBA6F; letter-spacing:.18em; font-size:8px; font-weight:600}
.me{display:flex; align-items:center; gap:10px; padding:12px 6px 0}
.me .av{width:34px; height:34px; font-size:12px; margin:0; border:0; background:var(--copper); color:#fff}
.me b{display:block; color:#fff; font-size:14px; font-weight:600; line-height:1.15}
.me small{display:block; color:var(--side-muted); font-size:11.5px}
.me button{margin-left:auto; color:var(--side-muted); font-size:11.5px; padding:4px 6px; border-radius:6px; white-space:nowrap}
.me > div{min-width:0}
.me button:hover{color:#fff; background:rgba(255,255,255,.08)}


/* ---------- powered by ---------- */
.pow{margin-top:2px}
.pow .lbl{font-size:11px; color:var(--side-muted); margin-bottom:5px; letter-spacing:.02em}
.pow .chip{display:inline-block; line-height:0}
.pow .chip img{width:138px; height:auto; display:block; margin:0}
.gate-card .pow{margin-top:26px; padding-top:18px; border-top:1px solid rgba(255,255,255,.12); display:flex; align-items:center; gap:14px}
.gate-card .pow .lbl{margin:0; color:#8F9BC2; font-size:12px}
.gate-card .pow .chip img{width:150px; margin:0}

/* ---------- vision ---------- */
.vto{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.vto .blk{padding:18px 22px; border-bottom:1px solid var(--line-2)}
.vto .blk:last-child{border-bottom:0}
.vto .blk h3{margin-bottom:8px; font-size:12.5px; color:var(--acc-ink); font-weight:600}
.vto ol,.vto ul{margin:0; padding-left:18px; color:var(--body)}
.vto li{margin:4px 0}
.vto .big{font-family:var(--display); font-weight:700; font-size:22px; color:var(--ink); line-height:1.15}

/* ---------- roles chart ---------- */
.tree{display:flex; flex-direction:column; align-items:center}
.seat{width:232px; background:var(--surface); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px; text-align:left}
.seat .role{font-family:var(--display); font-weight:700; font-size:15px; color:var(--ink)}
.seat .who{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:13.5px; color:var(--muted)}
.seat ul{margin:10px 0 0; padding-left:0; list-style:none; font-size:13px; color:var(--body); display:none}
.seat.open ul{display:block}
.seat li{padding:4px 0; border-top:1px solid var(--line-2)}
.seat .fit{display:flex; gap:4px; margin-top:10px; align-items:center; font-size:11.5px; color:var(--muted)}
.vline{width:1px; height:24px; background:var(--line)}
.branch{display:flex; gap:18px; align-items:flex-start; position:relative; padding-top:24px}
.branch::before{content:""; position:absolute; top:0; left:116px; right:116px; height:1px; background:var(--line)}
.branch > div{display:flex; flex-direction:column; align-items:center}
.branch > div::before{content:""; width:1px; height:24px; background:var(--line); margin-top:-24px}

/* ---------- console / settings ---------- */
.health{display:inline-flex; align-items:center; gap:8px}
.health .bar{width:84px; height:6px}
.health .bar > i{width:var(--w)}
.health .bar.mid > i{background:var(--warn)} .health .bar.low > i{background:var(--bad)}
.term{display:grid; grid-template-columns:1fr 1fr; gap:14px 22px}

@media (max-width:1100px){
  .s-body{grid-template-columns:1fr; gap:22px; padding:24px 24px 40px}
  .s-left{position:static; flex-direction:row; align-items:center; flex-wrap:wrap}
  .ring{width:150px; height:150px} .ring .big{font-size:36px}
  .s-left h1{font-size:32px}
  .g21,.g3{grid-template-columns:1fr 1fr}
  .home-h h1{font-size:36px}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static; height:auto; padding:14px 14px 10px; min-width:0; overflow:visible}
  .brand{border-bottom:0; padding-bottom:8px}
  .nav{flex-direction:row; overflow-x:auto; overflow-y:hidden; gap:4px; margin-top:6px; padding-bottom:6px; min-width:0; scrollbar-width:thin; flex:none}
  .nav a{white-space:nowrap; padding:8px 10px}
  .nav a.on{box-shadow:inset 0 -2px 0 var(--copper)}
  .nav .grp,.side-foot{display:none}
  .crumb .team-c,.crumb .sep,.crumb > span:last-child{display:none}
  .topbar{position:static; padding:14px 16px 8px}
  .page{padding:12px 16px 40px}
  .g2,.g3,.g21,.hl,.vto,.term{grid-template-columns:1fr}
  .figures{flex-wrap:wrap; gap:14px}
  .days{grid-template-columns:1fr 1fr}
  .tfigs{grid-template-columns:1fr 1fr}
  .trend{grid-template-columns:1fr}
  .fig{border-right:0; padding-right:0; margin-right:14px}
  .fig .v{font-size:34px}
  .home-h{flex-direction:column; align-items:flex-start}
  .home-h h1{font-size:30px}
  .s-top,.rail{padding-left:16px; padding-right:16px}
  .s-top{flex-wrap:wrap; gap:10px}
  .s-top .who span:not(.mark),.s-top .who .mark{display:none}
  .s-top .who b{white-space:nowrap}
  .s-top .tot span:last-child{display:none}
  .s-top > .row{width:100%; justify-content:space-between}
  .s-left .kbd{display:none}
  .rail .lbl{display:none}
  .s-body{padding:18px 16px 36px}
  .s-left h1{font-size:28px}
  .solve{grid-template-columns:1fr; margin-left:0}
  .branch{flex-direction:column; align-items:center}
  .branch::before{display:none}
}
</style>

<script>

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (n, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#ic-${n}"/></svg>`;
const uid = () => Math.random().toString(36).slice(2, 8);
let toastT; const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = (v, u) => u === "$k" ? "$" + Math.round(v) + "k" : u === "%" ? (Math.round(v * 10) / 10) + "%" : u === "min" ? (Math.round(v * 10) / 10) + " min" : (Number.isInteger(v) ? v : Math.round(v * 100) / 100);
const ok = (n, v) => n.dir === ">=" ? v >= n.goal : v <= n.goal;
const mmss = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const initials = (n) => n.split(" ").map((w) => w[0]).join("").slice(0, 2);

const AUTH_KEY = "mwc-los-auth";
async function sha256(s) { const b = new TextEncoder().encode(s); const h = await crypto.subtle.digest("SHA-256", b); return [...new Uint8Array(h)].map((x) => x.toString(16).padStart(2, "0")).join(""); }

/* ---------------- meeting parts ---------------- */
function segCheckin() {
  const t = T();
  return card("Who has shared", `<div class="people">${t.members.map((id) => `<button class="person ${t.shared.has(id) ? "on" : ""}" data-act="share" data-id="${id}"><span class="av">${initials(P[id].name)}</span><span>${esc(P[id].name)}<small>${esc(P[id].seat)}</small></span>${t.shared.has(id) ? ic("check") : ""}</button>`).join("")}</div>`, `${t.shared.size} of ${t.members.length}`);
}
function segNumbers() {
  const t = T(), miss = t.numbers.filter((n) => !ok(n, n.vals[12]));

function draftRecap() {

function mountBoard() {
  const wrap = $("#board"), cv = $("#board-c"); if (!cv) return;
  const B = S.coach.board, dpr = window.devicePixelRatio || 1, W = wrap.clientWidth, H = wrap.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 3;
  const draw = () => { ctx.clearRect(0, 0, W, H); B.strokes.forEach((s) => { ctx.strokeStyle = s.c; ctx.beginPath(); s.p.forEach((pt, i) => i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1])); ctx.stroke(); }); };
  draw();
  let cur = null;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = (e) => { cur = { c: B.color, p: [pos(e)] }; B.strokes.push(cur); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = (e) => { if (!cur) return; cur.p.push(pos(e)); draw(); };
  cv.onpointerup = cv.onpointercancel = () => { cur = null; };
  wrap.querySelectorAll(".note").forEach((el) => {
    const i = +el.dataset.note, grip = el.querySelector(".grip");
    let off = null;
    const down = (e) => { if (e.target.closest(".nt") || e.target.closest(".del")) return; const r = el.getBoundingClientRect(), wr = wrap.getBoundingClientRect(); off = [e.clientX - r.left, e.clientY - r.top, wr]; el.setPointerCapture(e.pointerId); e.preventDefault(); };
    el.onpointerdown = down;
    el.onpointermove = (e) => { if (!off) return; const x = Math.max(0, Math.min(W - 170, e.clientX - off[2].left - off[0])), y = Math.max(0, Math.min(H - 110, e.clientY - off[2].top - off[1])); el.style.left = x + "px"; el.style.top = y + "px"; B.notes[i].x = x; B.notes[i].y = y; };
    el.onpointerup = () => { off = null; };
    el.querySelector(".nt").oninput = (e) => { B.notes[i].text = e.target.textContent; };
  });
}

        <div>${seat("pr", ["Cash and forecasting", "Books and close", "AR and terms", "Fuel surcharge model", "Systems"])}${sub([seat("nw", ["AR collections", "Invoicing", "Timecards"], [1, 1, 1], true)])}</div>
        <div>${seat("jr", ["Hiring", "Onboarding and training", "Team member relations", "Compliance", "Turnover"])}${sub([seat("ko", ["Onboarding", "Benefits", "Policy"], [1, 1, 1], true)])}</div>
      </div></div>`;
}
function renderConsole() {
  const health = (c) => Math.round(c.rating * 4 + c.todo * .25 + c.num * .2 + c.pri * .15);
  const rows = [...S.console].sort((a, b) => health(a) - health(b));
  return head("Implementer console", "Every company you coach, on one screen. Who's healthy, who's drifting, and what to bring into Tuesday's session.", `<span class="pill">${S.console.length} companies</span>`)
    + figs([{ v: (S.console.reduce((a, c) => a + c.rating, 0) / S.console.length).toFixed(1), l: "average meeting rating" }, { v: S.console.reduce((a, c) => a + c.teams, 0), l: "teams running weekly meetings" }, { v: S.console.filter((c) => c.todo < 90).length, l: "companies under 90% to-dos", c: "warn" }, { v: "$1,840", l: "referral credit this quarter", d: "3 new subscriptions" }])
    + `<div class="card"><div class="card-b scroll-x"><table class="t"><thead><tr><th>Company</th><th>Teams</th><th>Next meeting</th><th class="num">Rating</th><th class="num">To-dos done</th><th class="num">Numbers on goal</th><th class="num">Priorities on track</th><th>Health</th><th></th></tr></thead>
    <tbody>${rows.map((c) => { const h = health(c); return `<tr><td class="nm">${esc(c.name)}</td><td>${c.teams}</td><td>${c.next}</td><td class="num">${c.rating.toFixed(1)}</td><td class="num">${c.todo}%</td><td class="num">${c.num}%</td><td class="num">${c.pri}%</td>
      <td><span class="health"><span class="bar ${h >= 75 ? "" : h >= 60 ? "mid" : "low"}" style="--w:${h}%"><i></i></span>${h}</span></td><td class="act"><button class="btn sm" data-act="openCo" data-n="${esc(c.name)}">Open</button></td></tr>`; }).join("")}</tbody></table></div></div>`;
}
function renderSettings() {
  const theme = document.documentElement.getAttribute("data-theme") || "auto";
  const hints = { meet: "The weekly meeting", num: "The numbers", pri: "The 90-day priorities", head: "Good and bad news", todo: "Seven-day commitments", issue: "The issues list", vision: "The one-page plan", roles: "The structure chart", q11: "The quarterly one-on-one between a leader and each report", review: "The review inside it (values, priorities, roles)" };
  return head("Settings", "The product ships with plain names. Your teams can call things whatever they already call them, and the change shows up everywhere.")
    + `<div class="card" style="margin-bottom:18px"><div class="card-h"><h2>Terminology</h2><button class="btn sm" data-act="resetLabels">Reset to defaults</button></div><div class="card-b term">
      ${Object.entries(S.labels).map(([k, v]) => `<label class="field">${hints[k]}<input class="input" data-label="${k}" value="${esc(v)}"></label>`).join("")}</div></div>
    <div class="card" style="margin-bottom:18px"><div class="card-h"><h2>Teams</h2><button class="btn sm ${S.ui.addTeam ? "primary" : ""}" data-act="ui" data-k="addTeam">${ic("plus")} Add a team</button></div>
      ${S.ui.addTeam ? `<div class="card-b" style="border-bottom:1px solid var(--line-2)"><form class="grid" data-form="addTeam" style="grid-template-columns:2fr 1fr 1fr 1.5fr;gap:12px;align-items:end"><label class="field">Team name<input class="input" name="name" required placeholder="Customer Service"></label><label class="field">Meets on<select class="input" name="day">${["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"].map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select></label><label class="field">At<input class="input" name="time" value="9:00 AM"></label><label class="field">Led by<select class="input" name="lead">${people.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label><label class="field" style="grid-column:1/-1">Seats on the team<div class="row" style="gap:10px 14px;margin-top:4px">${people.map((p) => `<label class="row" style="gap:6px;font-size:13.5px;color:var(--body)"><input type="checkbox" name="m" value="${p.id}">${esc(p.name)}</label>`).join("")}</div></label><div class="row"><button class="btn primary">Create team</button><button class="btn ghost" type="button" data-act="ui" data-k="addTeam">Cancel</button></div></form></div>` : ""}
      <div class="card-b list">${S.order.map((id) => { const t = S.teams[id]; return `<div class="item"><div class="txt"><div>${esc(t.name)}</div><div class="meta">${esc(t.day)}s at ${esc(t.time)}, ${t.members.length} seats, led by ${esc(P[t.lead].name)}</div></div><div class="avs">${t.members.map((m) => `<div class="av" title="${esc(P[m].name)}">${initials(P[m].name)}</div>`).join("")}</div>${id !== "lead" ? `<button class="btn sm ghost" data-act="removeTeam" data-team="${id}">Remove</button>` : ""}</div>`; }).join("")}</div></div>
    ${card("Appearance", `<div class="row">${["auto", "light", "dark"].map((t) => `<button class="btn ${theme === t ? "primary" : ""}" data-act="theme" data-t="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div>`)}
    <div class="card" style="margin-top:18px">${card("Demo data", `<p style="color:var(--muted);margin-bottom:12px">Everything you change in this demo is saved in this browser, so you can prep a walkthrough and come back to it. Reset puts the sample company back the way it started.</p><button class="btn" data-act="resetAll">Reset the demo data</button>`).slice(19, -6)}</div>`;
}

/* ---------------- actions ---------------- */
const nextRank = (t = T()) => { const used = new Set(t.issues.filter((i) => !i.solved && i.term === "short").map((i) => i.rank)); return [1, 2, 3].find((n) => !used.has(n)) || 0; };
const addIssue = (text, owner, t = T(), extra = {}) => { if (t.issues.some((i) => i.text === text)) { toast("Already on the issues list"); return; } t.issues.push({ id: uid(), text, owner, term: "short", rank: 0, ...extra }); toast(t === T() ? "Added to issues" : `Sent to the ${t.name}`); };
const ACT = {
  start() { const m = T().meeting; m.started = true; m.running = true; lastTick = performance.now(); },
  exit() { location.hash = "company"; return false; },
  pause() { const m = T().meeting; m.running = !m.running; lastTick = performance.now(); },
  nextSeg() { const m = T().meeting; if (m.finished) return; if (m.seg === SEGS.length - 1) { m.finished = true; m.running = false; if (!m.recap) draftRecap(); T().lastRating = m.rating || T().lastRating; toast(`Recap sent to ${T().members.length} team members`); } else m.seg++; },
  prevSeg() { const m = T().meeting; if (m.seg > 0 && !m.finished) m.seg--; },
  goSeg(el) { if (!T().meeting.finished) T().meeting.seg = +el.dataset.i; },
  fast() { T().meeting.fast = !T().meeting.fast; },
  reset() { location.reload(); },
  switchTeam(el) { S.teamId = el.dataset.team; },
  openTeam(el) { S.teamId = el.dataset.team; location.hash = "meet"; if (S.route === "meet") render(); return false; },
  share(el) { const s = T().shared; s.has(el.dataset.id) ? s.delete(el.dataset.id) : s.add(el.dataset.id); },
  numToIssue(el) { const n = T().numbers.find((x) => x.id === el.dataset.id); addIssue(`${n.name} off goal: ${fmt(n.vals[12], n.unit)} vs ${fmt(n.goal, n.unit)}`, n.owner); },
  priStatus(el) { T().priorities.find((p) => p.id === el.dataset.id).status = el.dataset.s; },
  priToIssue(el) { const p = T().priorities.find((x) => x.id === el.dataset.id); addIssue(`${p.title} is off track`, p.owner); },
  hlToIssue(el) { const h = T().headlines.find((x) => x.id === el.dataset.id); addIssue(h.text, T().lead); },
  toggleTodo(el) { const x = T().todos.find((y) => y.id === el.dataset.id); x.done = !x.done; },
  rankIssue(el) { const i = T().issues.find((x) => x.id === el.dataset.id); i.rank = i.rank ? 0 : nextRank(); },
  solving(el) { const i = T().issues.find((x) => x.id === el.dataset.id); const was = i.solving; T().issues.forEach((x) => (x.solving = false)); i.solving = !was; },
  park(el) { const i = T().issues.find((x) => x.id === el.dataset.id); i.term = "long"; i.rank = 0; i.solving = false; toast("Parked on the long-term list"); },
  unpark(el) { T().issues.find((x) => x.id === el.dataset.id).term = "short"; },
  escalate(el) { const t = T(), i = t.issues.find((x) => x.id === el.dataset.id); i.escalated = true; i.solving = false; addIssue(i.text, S.teams.lead.members.includes(i.owner) ? i.owner : t.lead, S.teams.lead, { from: t.short }); },
  rate(el) { T().meeting.rating = +el.dataset.v; },
  toast(el) { toast(el.dataset.m); return false; },
  signout() { try { localStorage.removeItem(AUTH_KEY); } catch (e) {} lock(); return false; },
  ui(el) { S.ui[el.dataset.k] = !S.ui[el.dataset.k]; if (el.dataset.k === "editRoles") S.ui.editSeat = null; },
  editSeat(el) { S.ui.editSeat = el.dataset.id || null; },
  print() { window.print(); return false; },
  resetAll() { if (confirm("Reset the demo to the original sample data? Anything you changed in this browser goes away.")) resetAll(); return false; },
  removeTeam(el) { const id = el.dataset.team; if (!confirm(`Remove ${S.teams[id].name} and its meeting?`)) return false; delete S.teams[id]; S.order = S.order.filter((x) => x !== id); if (S.teamId === id) S.teamId = "lead"; },
  book(el) { S.coach.booked = el.dataset.s; toast("Check-in booked"); },
  q11Sel(el) { S.q11.sel = el.dataset.id; },
  q11Rate(el) { const pr = S.q11.pairs.find((p) => p.id === S.q11.sel), k = el.dataset.kind, key = el.dataset.key; const bag = k === "values" ? pr.review.values : k === "roles" ? pr.review.roles : pr.review.pri; bag[key] = bag[key] === el.dataset.v ? null : el.dataset.v; if (k === "pri") S.order.forEach((id) => S.teams[id].priorities.forEach((p) => { if (p.title === key && p.status !== "done" && bag[key]) p.status = bag[key]; })); },
  q11Fit(el) { const f = S.fit[el.dataset.slot] || [1, 1, 1]; f[+el.dataset.i] = f[+el.dataset.i] ? 0 : 1; S.fit[el.dataset.slot] = f; },
  q11Draft() { toast("Draft saved"); },
  q11Done() { const pr = S.q11.pairs.find((p) => p.id === S.q11.sel); pr.done = "Sep 24"; if (pr.review.share) { const R_ = P[S.holder[pr.report] || pr.report]; S.coach.docs.unshift({ id: uid(), name: `${S.labels.q11} summary, ${R_.name}, ${S.q11.quarter}`, type: "doc", by: S.holder[pr.leader] || pr.leader, date: "Sep 24, 2026", size: "4 KB", folder: "qs" }); } toast(pr.review.share ? "Complete. Summary shared with Rachel." : "Marked complete"); },
  q11Reopen() { const pr = S.q11.pairs.find((p) => p.id === S.q11.sel); pr.done = null; },
  folder(el) { S.coach.view = el.dataset.f || null; },
  newFolder() { const n = prompt("Folder name"); if (!n) return false; S.coach.folders.push({ id: uid(), name: n }); toast(`Folder "${n}" created`); },
  boardOpen() { S.coach.board.open = true; },
  boardClose() { S.coach.board.open = false; },
  boardColor(el) { S.coach.board.color = el.dataset.k; },
  boardClear() { S.coach.board.strokes = []; S.coach.board.notes = []; },
  boardNote() { const b = S.coach.board; b.notes.push({ x: 40 + (b.notes.length * 36) % 400, y: 40 + (b.notes.length * 28) % 240, text: "Type here" }); },
  noteDel(el) { S.coach.board.notes.splice(+el.dataset.i, 1); },
  boardSave() { const b = S.coach.board; const n = prompt("Name this whiteboard", "Quarterly session working board") || "Untitled whiteboard"; S.coach.docs.unshift({ id: uid(), name: n, type: "board", by: "mb", date: "Sep 24, 2026", size: "", folder: "wb" }); b.open = false; b.strokes = []; b.notes = []; toast("Whiteboard saved to the shared folder"); },
  prepToggle() { S.coach.prep.open = !S.coach.prep.open; },
  draftRecap() { draftRecap(); },
  sendRecap() { toast(`Recap sent to ${T().members.length} team members`); },
  ms(el) { const p = T().priorities.find((x) => x.id === el.dataset.id); p.milestones[+el.dataset.i][1] = p.milestones[+el.dataset.i][1] ? 0 : 1; },
  seatToggle(el) { el.classList.toggle("open"); return false; },
  openCo(el) { if (el.dataset.n === S.company) { location.hash = "company"; return false; } toast(`Switching to ${el.dataset.n}`); return false; },
  resetLabels() { S.labels = { meet: "Weekly Meeting", num: "Weekly Numbers", pri: "Quarterly Priorities", head: "Headlines", todo: "To-Dos", issue: "Issues", vision: "Vision & Plan", roles: "Roles Chart" }; },
  theme(el) { const t = el.dataset.t; if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("mwc-los-theme", t); } catch (e) {} },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === "A") e.preventDefault();
  const res = fn(el);
  if (el.tagName === "A" && el.getAttribute("href")) { location.hash = el.getAttribute("href").slice(1); }
  if (res === false) return;
  render();
});
document.addEventListener("change", (e) => {
  if (e.target.matches("[data-team]")) { S.teamId = e.target.value; if (!TEAM_ROUTES.includes(S.route)) location.hash = "meet"; render(); }
  if (e.target.matches("[data-q11-share]")) { const pr = S.q11.pairs.find((p) => p.id === S.q11.sel); if (pr) { pr.review.share = e.target.checked; save(); } }
  if (e.target.matches("[data-upload]")) { const fs = [...e.target.files]; fs.forEach((f) => S.coach.docs.unshift({ id: uid(), name: f.name, type: /pdf$/i.test(f.name) ? "pdf" : /xls|csv/i.test(f.name) ? "sheet" : "doc", by: "mb", date: "Sep 24, 2026", size: f.size > 1e6 ? (f.size / 1e6).toFixed(1) + " MB" : Math.round(f.size / 1e3) + " KB", folder: S.coach.view || "qs" })); toast(`${fs.length} file${fs.length === 1 ? "" : "s"} shared with Rachel`); render(); }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault(); const d = new FormData(f), t = T();
  if (f.dataset.form === "solve") {
    const i = t.issues.find((x) => x.id === f.dataset.id); i.solved = true; i.solving = false; const r0 = i.rank; i.rank = 0; if (r0) t.issues.forEach((x) => { if (x.rank > r0) x.rank--; });
    t.todos.push({ id: uid(), text: d.get("text"), owner: d.get("owner"), due: t.due, done: false, fromMeeting: true }); t.meeting.recap = null; toast("Issue solved. To-do added for " + first(d.get("owner")));
  } else if (f.dataset.form === "addIssue") addIssue(d.get("text"), d.get("owner"));
  else if (f.dataset.form === "addHl") t.headlines.push({ id: uid(), kind: d.get("kind"), good: d.get("good") === "1", text: d.get("text") });
  else if (f.dataset.form === "prep") { S.coach.prep.submitted.push(d.get("who")); S.coach.prep.open = false; toast(`Session prep submitted for ${first(d.get("who"))}`); }
  else if (f.dataset.form === "addNum") { const g = parseFloat(d.get("goal")); t.numbers.push({ id: uid(), name: d.get("name"), owner: d.get("owner"), goal: g, dir: d.get("dir"), unit: d.get("unit"), vals: Array.from({ length: 13 }, () => g) }); S.ui.addNum = false; toast("Measurable added. It starts tracking this week."); }
  else if (f.dataset.form === "addPri") { const ms = (d.get("ms") || "").split(",").map((x) => x.trim()).filter(Boolean); t.priorities.push({ id: uid(), title: d.get("title"), owner: d.get("owner"), scope: d.get("scope"), status: "on", milestones: ms.length ? ms.map((x) => [x, 0]) : [["Done", 0]] }); S.ui.addPri = false; toast("Priority added"); }
  else if (f.dataset.form === "addTeam") { const id = uid(), members = d.getAll("m"), leadId = d.get("lead"); if (!members.includes(leadId)) members.unshift(leadId); const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], di = +d.get("day");
    S.teams[id] = { id, name: d.get("name"), short: d.get("name").split(" ")[0], day: days[di], dayIdx: di, time: d.get("time"), date: `${days[di]}, ${["September 28", "September 29", "September 30", "October 1", "October 2"][di]}, 2026`, due: ["Oct 5", "Oct 6", "Oct 7", "Oct 8", "Oct 9"][di], lastRating: 0, lead: leadId, members, numbers: [], priorities: [], issues: [], todos: [], headlines: [], history: [], ratings: [], meeting: newMeeting(), shared: new Set() };
    S.order.push(id); S.ui.addTeam = false; toast(`${d.get("name")} created. Add its numbers and priorities from the team's pages.`); }
  else if (f.dataset.form === "seatEdit") { const slot = f.dataset.id, who = d.get("who"), roles = (d.get("roles") || "").split("\n").map((x) => x.trim()).filter(Boolean);
    S.seatTitles[slot] = d.get("seat"); S.seats[slot] = roles; S.fit[slot] = [0, 1, 2].map((i) => d.get("f" + i) ? 1 : 0);
    const prev = S.holder[slot]; if (who !== prev) { const other = Object.keys(S.holder).find((k) => S.holder[k] === who); if (other) S.holder[other] = prev; S.holder[slot] = who; }
    Object.entries(S.holder).forEach(([s, w]) => { P[w].seat = S.seatTitles[s]; }); S.ui.editSeat = null; toast("Seat updated"); }
  else if (f.dataset.form === "msg") { S.ui.msgOpen = false; toast("Message sent to Rachel"); }

  render();
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.bind === "cascade") T().meeting.cascade = el.value;
  if (el.dataset.q11) { const pr = S.q11.pairs.find((p) => p.id === S.q11.sel); if (pr) pr.review[el.dataset.q11] = el.value; }
  if (el.dataset.label) { S.labels[el.dataset.label] = el.value || S.labels[el.dataset.label]; renderNav(); renderTop(); }
  save();
});
document.addEventListener("keydown", (e) => {
  if (!presenting() || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") { ACT.nextSeg(); render(); }
  else if (e.key === "ArrowLeft") { ACT.prevSeg(); render(); }
  else if (e.key === " ") { e.preventDefault(); ACT.pause(); render(); }
});

/* ---------------- boot ---------------- */
try { const t = localStorage.getItem("mwc-los-theme"); if (t && t !== "auto") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
if (!getUser()) lock();
load();
S.route = location.hash.replace("#", "") || "meet";
if (!S.teams[S.teamId]) S.teamId = "lead";
render();
</script>
